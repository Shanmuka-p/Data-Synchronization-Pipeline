write-service:
  build:
    context: ./write-service
  ports:
    - "${WRITE_SERVICE_PORT:-8080}:8080"
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    - POSTGRES_HOST=postgres
    - POSTGRES_DB=${POSTGRES_DB:-products_db}
    - POSTGRES_USER=${POSTGRES_USER:-user}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    - PORT=8080
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "require('http').get('http://localhost:8080/api/products', (r) => {if(r.statusCode !== 404) process.exit(1)})",
      ]
    interval: 10s
    timeout: 5s
    retries: 5
